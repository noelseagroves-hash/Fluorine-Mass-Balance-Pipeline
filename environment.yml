# Environment for running TA_Processing.ipynb.
#
#   conda env create -f environment.yml
#   conda activate fluorine
#
# conda-forge only, deliberately. Anaconda's default channels require accepting
# their terms of service, which carry restrictions on organisational use.
name: fluorine
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - pandas>=3.0        # section 1 relies on pandas 3 string-dtype behaviour
  - pyyaml
  - scipy
  - openpyxl          # writing final_data.xlsx in §11
  - jupyter
  - ipykernel
